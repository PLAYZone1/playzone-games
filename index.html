<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عجلة الحظ | PlayZone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #202957, #090d1e 75%);
    color: white;
    min-height: 100vh;
    text-align: center;
    padding: 22px 15px 40px;
}

header {
    margin-bottom: 25px;
}

.logo {
    display: inline-block;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #9daaff;
    border: 1px solid #414b80;
    padding: 9px 17px;
    border-radius: 30px;
    margin-bottom: 17px;
}

h1 {
    font-size: clamp(30px, 7vw, 45px);
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ffdc72, #ff8ecf, #a9a4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.subtitle {
    color: #aeb8d7;
    font-size: 14px;
    line-height: 1.8;
}

.game {
    max-width: 480px;
    margin: auto;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    padding: 23px 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.wheel-area {
    position: relative;
    width: min(100%, 360px);
    aspect-ratio: 1;
    margin: 0 auto 22px;
    padding: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd76a, #ff83d0, #8e8cff, #ffd76a);
    box-shadow: 0 0 35px rgba(139,128,255,.22);
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
}

.pointer {
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 32px solid #fff4bd;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,.5));
    z-index: 3;
}

.center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 57px;
    height: 57px;
    border-radius: 50%;
    background: #fff;
    color: #171b38;
    display: grid;
    place-items: center;
    font-size: 25px;
    border: 5px solid #ffdc72;
    box-shadow: 0 0 20px rgba(0,0,0,.35);
    pointer-events: none;
}

button {
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: transform .15s, opacity .2s;
}

button:active {
    transform: scale(.97);
}

.spin {
    width: 100%;
    padding: 17px;
    border-radius: 17px;
    color: #15162b;
    background: linear-gradient(100deg, #ffdc72, #ff9bcf);
    box-shadow: 0 7px 24px rgba(255,154,204,.17);
    font-size: 19px;
}

.spin:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.section-title {
    text-align: right;
    font-size: 17px;
    margin: 24px 0 12px;
}

textarea {
    width: 100%;
    min-height: 115px;
    background: #10162e;
    border: 1px solid #343e68;
    color: white;
    border-radius: 15px;
    padding: 14px;
    font-size: 15px;
    line-height: 1.8;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #a19bff;
}

.hint {
    text-align: right;
    color: #929dbf;
    font-size: 12px;
    margin: 8px 2px 12px;
}

.actions {
    display: flex;
    gap: 9px;
}

.actions button {
    flex: 1;
    padding: 13px 8px;
    border-radius: 12px;
}

.update {
    background: #a49aff;
    color: #15152b;
}

.clear {
    background: #292f4d;
    color: #e2e5ff;
}

.status {
    color: #abb5d5;
    margin-top: 15px;
    font-size: 13px;
}

footer {
    color: #7782a7;
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 1px;
}

.modal {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(4,7,20,.82);
    backdrop-filter: blur(8px);
}

.modal.show {
    display: flex;
}

.result {
    width: 100%;
    max-width: 340px;
    padding: 30px 20px;
    background: linear-gradient(145deg, #252d55, #151a34);
    border: 1px solid #7770bd;
    border-radius: 25px;
    box-shadow: 0 0 60px rgba(146,126,255,.2);
    animation: appear .35s ease;
}

@keyframes appear {
    from { opacity: 0; transform: scale(.8); }
    to { opacity: 1; transform: scale(1); }
}

.trophy {
    font-size: 55px;
    margin-bottom: 12px;
}

.result h2 {
    color: #ffdc72;
    margin-bottom: 12px;
}

.winner {
    font-size: 28px;
    font-weight: bold;
    overflow-wrap: anywhere;
    margin: 20px 0;
}

.close {
    width: 100%;
    padding: 14px;
    border-radius: 13px;
    background: linear-gradient(100deg, #ffdc72, #ff9bcf);
    color: #17162b;
}

@media (max-width: 380px) {
    .game { padding: 18px 12px; }
    .wheel-area { padding: 9px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">✦ PLAYZONE GAMES ✦</div>
    <h1>عجلة الحظ</h1>
    <p class="subtitle">أدر العجلة… ودع الحظ يختار الفائز! 🎯</p>
</header>

<main class="game">

    <div class="wheel-area">
        <div class="pointer"></div>
        <canvas id="wheel" width="700" height="700"></canvas>
        <div class="center">★</div>
    </div>

    <button class="spin" id="spinBtn" onclick="spinWheel()">
        🎡 أدر عجلة الحظ
    </button>

    <p class="status" id="status">أضف الأسماء ثم ابدأ الدوران</p>

    <h3 class="section-title">✦ أسماء المشاركين</h3>

    <textarea id="names" placeholder="اكتب اسم كل مشارك في سطر منفصل&#10;أحمد&#10;محمد&#10;علي&#10;سارة"></textarea>

    <p class="hint">💡 اكتب كل اسم في سطر منفصل.</p>

    <div class="actions">
        <button class="update" onclick="updateNames()">تحديث الأسماء ✓</button>
        <button class="clear" onclick="clearNames()">مسح الكل</button>
    </div>

</main>

<footer>PLAYZONE · LET THE LUCK DECIDE</footer>

<div class="modal" id="modal">
    <div class="result">
        <div class="trophy">🏆</div>
        <h2>مبروك للفائز!</h2>
        <div class="winner" id="winner"></div>
        <button class="close" onclick="closeModal()">رائع! ✨</button>
    </div>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const namesBox = document.getElementById("names");
const spinBtn = document.getElementById("spinBtn");
const statusText = document.getElementById("status");

const colors = [
    "#ff6482", "#7667ff", "#ffb84d", "#22c8b8",
    "#f06bc0", "#4c9cff", "#a5d957", "#ff8059",
    "#9b7bff", "#f3c95b", "#40c9e5", "#ef7197"
];

let names = ["أحمد", "محمد", "علي", "سارة", "خالد", "نور"];
let rotation = 0;
let spinning = false;

namesBox.value = names.join("\n");

function drawWheel() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 335;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (names.length === 0) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#303858";
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("أضف أسماءك", cx, cy);
        return;
    }

    const slice = (Math.PI * 2) / names.length;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);

    names.forEach((name, i) => {
        const start = i * slice;
        const end = start + slice;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        ctx.strokeStyle = "rgba(255,255,255,.7)";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,.3)";
        ctx.shadowBlur = 4;

        let fontSize = names.length > 15 ? 19 :
                       names.length > 9 ? 23 : 28;

        ctx.font = `bold ${fontSize}px Arial`;

        let displayName = name;
        while (ctx.measureText(displayName).width > radius * .66 &&
               displayName.length > 2) {
            displayName = displayName.slice(0, -1);
        }

        if (displayName !== name) displayName += "…";

        ctx.fillText(displayName, radius - 25, 0);
        ctx.restore();
    });

    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 7;
    ctx.stroke();
}

function updateNames() {
    if (spinning) return;

    const entered = namesBox.value
        .split("\n")
        .map(n => n.trim())
        .filter(n => n.length > 0);

    if (entered.length < 2) {
        statusText.textContent = "⚠️ أدخل اسمين على الأقل للبدء.";
        return;
    }

    names = entered;
    rotation = 0;
    drawWheel();

    statusText.textContent = `تم تجهيز العجلة بـ ${names.length} مشاركًا ✓`;
}

function clearNames() {
    if (spinning) return;

    names = [];
    namesBox.value = "";
    rotation = 0;
    drawWheel();

    statusText.textContent = "تم مسح الأسماء. أضف أسماء جديدة.";
}

function spinWheel() {
    if (spinning) return;

    if (names.length < 2) {
        statusText.textContent = "⚠️ أضف اسمين على الأقل واضغط تحديث الأسماء.";
        return;
    }

    spinning = true;
    spinBtn.disabled = true;
    statusText.textContent = "🎡 العجلة تدور… من سيكون الفائز؟";

    const slice = (Math.PI * 2) / names.length;
    const winnerIndex = Math.floor(Math.random() * names.length);

    // تحديد الاسم المختار تحت المؤشر الموجود أعلى العجلة
    const targetAngle = (
        Math.PI * 1.5 -
        (winnerIndex * slice + slice / 2)
    );

    const current = ((rotation % (Math.PI * 2)) + Math.PI * 2)
                    % (Math.PI * 2);

    let delta = targetAngle - current;
    delta = ((delta % (Math.PI * 2)) + Math.PI * 2)
            % (Math.PI * 2);

    const extraTurns = 6 + Math.floor(Math.random() * 4);
    const startRotation = rotation;
    const totalRotation = extraTurns * Math.PI * 2 + delta;
    const duration = 4800;
    const startTime = performance.now();

    function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 5);

        rotation = startRotation + totalRotation * eased;
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            rotation = ((rotation % (Math.PI * 2)) + Math.PI * 2)
                       % (Math.PI * 2);

            drawWheel();

            spinning = false;
            spinBtn.disabled = false;

            const winnerName = names[winnerIndex];
            document.getElementById("winner").textContent = winnerName;
            document.getElementById("modal").classList.add("show");
            statusText.textContent = `🏆 الفائز هو: ${winnerName}`;
        }
    }

    requestAnimationFrame(animate);
}

function closeModal() {
    document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
});

drawWheel();
</script>

</body>
</html>
